[project]
name = "clipstudio-backend"
version = "0.1.0"
description = "Pipeline próprio de cortes automáticos, legendas e exportação de vídeos"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "google-genai>=2.0",
    "pillow>=11",
    "numpy>=2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "opencv-python-headless>=4.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
claude = ["anthropic>=1.0"]  # só para LLM_PROVIDER=claude
postgres = ["psycopg[binary]>=3.2"]  # só para DATABASE_URL=postgresql+psycopg://...

[project.scripts]
clipstudio = "app.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: testes que executam ffmpeg/whisper (mais lentos)"]
